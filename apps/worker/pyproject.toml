[project]
name = "nasdaq-worker"
version = "0.1.0"
description = "Data ingestion worker for S&P 500 Swipe"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools]
packages = ["nasdaq_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
